{
  "openapi": "3.0.3",
  "info": {
    "title": "会员认证与可撤销会话",
    "version": "1.0.0",
    "description": "PC和移动端共用同源Cookie认证；所有写请求必须匹配Origin。第三方首次授权需验证并关联平台账号。"
  },
  "paths": {
    "/api/console/v1/auth/options": {
      "get": {
        "summary": "读取登录与找回密码能力",
        "description": "建立或续期30分钟的hlyq_auth_binding HttpOnly Cookie；手机号验证码登录仅在模板及通道启用时可用。",
        "security": [],
        "responses": {
          "200": {
            "description": "成功；响应禁止缓存，凭据仅通过HttpOnly Cookie发送。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "code",
                    "message",
                    "data",
                    "request_id"
                  ],
                  "properties": {
                    "code": {
                      "type": "integer",
                      "enum": [
                        0
                      ]
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "type": "object",
                      "required": [
                        "sms_login",
                        "password_reset",
                        "oauth_providers"
                      ],
                      "properties": {
                        "sms_login": {
                          "type": "boolean"
                        },
                        "password_reset": {
                          "type": "object",
                          "required": [
                            "mobile",
                            "email"
                          ],
                          "properties": {
                            "mobile": {
                              "type": "boolean"
                            },
                            "email": {
                              "type": "boolean"
                            }
                          }
                        },
                        "oauth_providers": {
                          "type": "array",
                          "items": {
                            "type": "string",
                            "enum": [
                              "qq",
                              "wechat"
                            ]
                          },
                          "description": "按已启用且配置有效的QQ、微信通道展示；无可用通道时为空"
                        }
                      }
                    },
                    "request_id": {
                      "type": "string",
                      "minLength": 1
                    }
                  }
                }
              }
            }
          },
          "403": {
            "description": "Origin或浏览器绑定无效",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "code",
                    "message",
                    "data",
                    "request_id"
                  ],
                  "properties": {
                    "code": {
                      "type": "integer",
                      "minimum": 40000
                    },
                    "message": {
                      "type": "string"
                    },
                    "request_id": {
                      "type": "string",
                      "minLength": 1
                    },
                    "data": {
                      "type": "object",
                      "nullable": true,
                      "properties": {
                        "errors": {
                          "type": "object",
                          "additionalProperties": {
                            "type": "array",
                            "items": {
                              "type": "string"
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "422": {
            "description": "输入或验证码校验失败，字段错误位于data.errors",
