  "info": {
    "title": "会员在线充值和支付确认",
    "version": "1.0.0",
    "description": "PC/Mobile共用会员Cookie。所有写请求检查Origin，归属以会话确定。支付请求超时为unknown，不重复发起；原配置加密封存。上游验签或主动查单确认paid后，支付、充值、资金来源批次、不可变流水、余额及消息同事务提交。第三方回调位于/api之外的/payment-notify/{随机标识}，支付宝使用表单通知及纯文本success，微信使用原始JSON和四个签名头及204应答，仅在提交入账后应答。详见docs/development/online-payments.md。"
  },
