    "/api/admin/v1/message-logs": {
      "get": {
        "operationId": "admin.message-logs.index",
        "description": "需要 admin.message-logs.view；独立条件 AND。无正文、地址或凭据。",
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100000,
              "default": 1
            },
            "description": ""
          },
          {
            "name": "page_size",
            "in": "query",
            "schema": {
              "type": "integer",
              "enum": [
                10,
                20,
                50,
                100
              ],
              "default": 10
            },
            "description": ""
          },
          {
            "name": "scene",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 64
            },
            "description": ""
          },
          {
            "name": "business_type",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 64
            },
            "description": ""
          },
          {
            "name": "sort_order",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "asc",
                "desc"
              ],
              "default": "desc"
            },
            "description": "按 created_at、id 同向排序"
          },
          {
            "name": "purpose",
            "in": "query",
            "description": "独立AND条件；渠道与投递结果需匹配同一任务",
            "schema": {
              "type": "string",
              "enum": [
                "verification",
                "notification",
                "marketing",
                "system"
              ]
            }
          },
          {
            "name": "channel",
            "in": "query",
            "description": "独立AND条件；渠道与投递结果需匹配同一任务",
            "schema": {
              "type": "string",
              "enum": [
                "email",
                "sms",
                "message",
                "wechat",
                "dingtalk",
                "wecom",
                "feishu"
              ]
            }
          },
          {
            "name": "delivery_status",
            "in": "query",
            "description": "独立AND条件；渠道与投递结果需匹配同一任务",
            "schema": {
              "type": "string",
              "enum": [
                "pending",
                "processing",
                "accepted",
                "delivered",
                "failed",
                "unknown"
              ]
            }
          },
          {
            "name": "audience",
            "in": "query",
            "description": "与渠道及投递结果匹配同一条投递；多条件AND",
            "schema": {
              "type": "string",
              "enum": [
                "customer",
                "admin",
                "robot"
              ]
            }
          },
          {
            "name": "status",
            "in": "query",
            "description": "逻辑消息全部投递的总体结果；先聚合再分页",
            "schema": {
              "type": "string",
              "enum": [
                "inactive",
                "pending",
                "processing",
                "accepted",
                "delivered",
                "partial",
                "failed",
                "unknown"
              ]
            }
          },
          {
            "name": "business_id",
            "in": "query",
            "description": "关联业务主键，配合business_type精准定位；不是业务单号",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9007199254740991
            }
          },
          {
            "name": "created_from",
            "in": "query",
            "description": "记录起始日期（含当日00:00:00）",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "created_to",
            "in": "query",
            "description": "记录结束日期（含当日整天），不得早于起始日期",
            "schema": {
              "type": "string",
              "format": "date"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "统一成功响应",
            "headers": {
              "X-Request-Id": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "code",
                    "message",
                    "data",
                    "request_id"
                  ],
                  "properties": {
                    "code": {
                      "type": "integer",
                      "const": 0
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "$ref": "#/components/schemas/LogList"
                    },
                    "request_id": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "会话无效",
            "headers": {
              "X-Request-Id": {
                "schema": {
                  "type": "string"
