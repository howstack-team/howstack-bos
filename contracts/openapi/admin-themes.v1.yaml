                      - object
                      - "null"
                    additionalProperties: true
                  request_id:
                    type: string
      description: 需主题切换权限；开关与主题选择按revision在同一事务保存。无移动端模板时开启返回422，旧修订返回409。缺少整个console时以default会员模板的能力为准。
  /api/admin/v1/themes/install:
    post:
      operationId: siteThemesInstall
      description: 每个主题ID仅保留一个已安装记录。同ID包更新原记录并保留兼容配置，新增字段使用默认值；配置不兼容返回422，当前主题不变。更新已启用主题同时要求配置修改及主题切换权限。版本号仅作包资料，相同内容重复上传无变化。
      summary: 安装或更新主题，新主题不自动启用
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: integer
                    const: 0
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - theme_id
                      - name
                      - version
                      - digest
                      - components
                    properties:
                      id:
                        type: integer
                        minimum: 1
                      theme_id:
                        type: string
                        pattern: ^[a-z][a-z0-9_-]{0,63}$
                      name:
                        type: string
                      version:
                        type: string
                      digest:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      components:
                        type: array
                        items:
                          type: string
                          enum:
                            - website
                            - pc
                            - mobile
                  request_id:
                    type: string
        "401":
          description: 认证、权限、输入验证或并发冲突错误
