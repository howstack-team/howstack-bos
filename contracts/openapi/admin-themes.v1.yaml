  - adminCookie: []
paths:
  /api/admin/v1/themes:
    get:
      operationId: siteThemesList
      summary: 读取官网与会员中心安装主题目录
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: integer
                    const: 0
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - theme_id
                        - name
                        - version
                        - digest
                        - components
                        - active
                        - cover
                        - builtin
                      properties:
                        id:
                          type: integer
                          minimum: 1
                        theme_id:
                          type: string
                          pattern: ^[a-z][a-z0-9_-]{0,63}$
                        name:
                          type: string
                        version:
                          type: string
                        digest:
                          type: string
                          pattern: ^[a-f0-9]{64}$
                        components:
                          type: array
                          items:
                            type: string
                            enum:
                              - website
                              - pc
                              - mobile
                        active:
                          type: array
                          items:
                            type: string
                            enum:
                              - website
                              - pc
                              - mobile
                        cover:
                          type: string
                        builtin:
                          type: boolean
                  request_id:
                    type: string
        "401":
          description: 认证、权限、输入验证或并发冲突错误
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
