                    additionalProperties: true
                  request_id:
                    type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 单根目录ZIP，最大25MiB
