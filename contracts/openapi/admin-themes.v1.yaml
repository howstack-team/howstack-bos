                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type:
                      - object
                      - "null"
                    additionalProperties: true
                  request_id:
                    type: string
        "403":
          description: 认证、权限、输入验证或并发冲突错误
          content:
            application/json:
