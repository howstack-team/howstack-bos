                      - release_id
                      - default_release_id
                      - website
                      - console
                      - mobile_enabled
                    properties:
                      revision:
                        type: integer
                        minimum: 1
                      release_id:
                        type: integer
                        minimum: 1
                      default_release_id:
                        type: integer
                        minimum: 1
                      website:
                        type: object
                        additionalProperties: false
                        required:
                          - release_id
                          - fallback
                        properties:
                          release_id:
                            type: integer
                            minimum: 1
                          fallback:
                            type: boolean
                      console:
                        type: object
                        additionalProperties: false
                        required:
                          - release_id
                          - fallback
                          - mobile_available
                        properties:
                          release_id:
                            type: integer
                            minimum: 1
                          fallback:
                            type: boolean
                          mobile_available:
                            type: boolean
                            description: 实际会员中心主题是否提供有效的mobile模板；由系统识别，包括整组件default回退
                      mobile_enabled:
                        type: boolean
                        description: 是否启用当前会员中心主题的独立移动端模板
                  request_id:
                    type: string
        "401":
