openapi: 3.0.3
info:
  title: 皓量云擎后台系统设置 API
  version: 1.1.0
  description: 分类为 base、security、registration 和 notifications，表单结构由代码固定定义。PUT 提交完整分类， 不允许任意设置键或额外字段。基础设置当前仅持久化，未承诺驱动全站品牌展示。后台入口单独保存，实时生效。
servers:
  - url: /api/admin/v1
security:
  - AdminCookie: []
  - AdminBearer: []
tags:
  - name: 系统设置
paths:
  /system/version:
    get:
      tags:
        - 系统设置
      operationId: admin.system-version.show
      summary: 读取当前代码包版本
      description: 需要 admin.page.settings.view。授权与更新页面使用独立的 system-updates 接口和 admin.updates.view 权限。 current_version 来自 backend/config/version.php，不代表数据库迁移已完成， 不触发远程版本检查、下载或更新，也不包含商业授权信息。
      responses:
        "200":
          description: 本地代码版本
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - current_version
                        properties:
                          current_version:
                            type: string
                            minLength: 1
                            example: 0.1.0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /settings/categories:
    get:
      tags:
        - 系统设置
      operationId: admin.settings.categories
      summary: 读取已实现的设置分类
      description: 需要 admin.page.settings.view；按 sort_order、id 排序。
      responses:
        "200":
          description: 分类列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /settings/base:
    get:
      tags:
        - 系统设置
      operationId: getBaseSettings
      summary: 读取基础设置
      description: 需要 admin.page.settings.view。
      responses:
        "200":
          $ref: "#/components/responses/BaseSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - 系统设置
      operationId: updateBaseSettings
      summary: 保存完整基础设置
      description: 同时需要 admin.page.settings.view 和 admin.page.settings.update。 去除字符串首尾空白，事务内保存完整分类，返回已保存的值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseSettingsInput"
      responses:
        "200":
          $ref: "#/components/responses/BaseSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /settings/registration:
    get:
      tags:
        - 系统设置
      summary: 读取会员注册设置
      description: 需要 admin.page.settings.view。
      responses:
        "200":
          description: 统一响应 data 为 RegistrationSettings
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: integer
                    enum:
                      - 0
                  message: &a1
                    type: string
                  data:
                    type: object
                    required:
                      - mobile_enabled
                      - email_enabled
                      - mobile_verification
                      - email_verification
                    properties:
                      mobile_enabled:
                        type: integer
                        enum:
                          - 0
                          - 1
                      email_enabled:
                        type: integer
                        enum:
                          - 0
                          - 1
                      mobile_verification:
                        type: integer
                        enum:
                          - 0
                          - 1
                      email_verification:
                        type: integer
                        enum:
                          - 0
                          - 1
                  request_id:
                    type: string
                    minLength: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - 系统设置
      summary: 保存完整会员注册设置
      description: 需要 view 和 update 权限；只接受四个完整JSON整数开关；不更改既有会员的登录资格。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationSettings"
      responses:
        "200":
          description: 返回实际保存的完整设置
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: integer
                    enum:
                      - 0
                  message: *a1
                  data:
                    type: object
                    required:
                      - mobile_enabled
                      - email_enabled
                      - mobile_verification
                      - email_verification
                    properties:
                      mobile_enabled:
                        type: integer
                        enum:
                          - 0
                          - 1
                      email_enabled:
                        type: integer
                        enum:
                          - 0
                          - 1
                      mobile_verification:
                        type: integer
                        enum:
                          - 0
                          - 1
                      email_verification:
                        type: integer
                        enum:
                          - 0
                          - 1
                  request_id:
                    type: string
                    minLength: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /settings/admin-entry:
    get:
      tags:
        - 系统设置
      operationId: admin.settings.admin-entry.show
      summary: 读取当前后台访问路径
      description: 需要 admin.page.settings.view。读取安装配置中实时生效的路径，不从进程环境缓存读取。
      responses:
        "200":
          $ref: "#/components/responses/AdminEntrySuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - 系统设置
      operationId: admin.settings.admin-entry.update
      summary: 修改后台访问路径
      description: 同时需要系统设置查看和修改权限、同源 Origin。检查系统保留路径、宿主路由、公开资源及已安装主题页面冲突；在文件锁中比较 current_admin_path 并原子更新 ADMIN_PATH，保留其余安装配置。保存后原页面入口失效，无需重启；API、静态资源和已签发凭据不变。安装记录 admin_path 保留首次安装历史值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - admin_path
                - current_admin_path
              properties:
                admin_path:
                  type: string
                  pattern: ^[a-z][a-z0-9-]{2,31}$
                  minLength: 3
                  maxLength: 32
                  description: 新首级路径，不含斜线，不自动转换大小写或删除字符。
                current_admin_path:
                  type: string
                  pattern: ^[a-z][a-z0-9-]{2,31}$
                  minLength: 3
                  maxLength: 32
                  description: 上次读取的生效路径；不一致返回409，不覆盖其他管理员的修改。
      responses:
        "200":
          $ref: "#/components/responses/AdminEntrySuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 当前入口已变化或系统尚未安装，原配置不变。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "423":
          description: 配置文件锁无法取得。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /settings/security:
    get:
      tags:
        - 系统设置
      operationId: getSecuritySettings
      summary: 读取安全设置
      description: 需要 admin.page.settings.view；返回原生整数。
      responses:
        "200":
          $ref: "#/components/responses/SecuritySuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - 系统设置
      operationId: updateSecuritySettings
      summary: 保存完整安全设置
      description: 同时需要 admin.page.settings.view 和 admin.page.settings.update。 仅接受 JSON 原生整数，数字字符串、布尔值和浮点数均被拒绝。 JWT 有效期仅影响新签发令牌；已有令牌保留自身 exp。 登录频率实时使用 Redis 固定窗口，所有登录尝试均计数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecuritySettings"
      responses:
        "200":
          $ref: "#/components/responses/SecuritySuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /settings/notifications:
    get:
      tags:
        - 系统设置
      operationId: admin.settings.notifications.show
      summary: 读取共享机器人配置状态
      description: 需要 admin.page.settings.view；不回显原始凭据。
      responses:
        "200":
          $ref: "#/components/responses/NotificationSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - 系统设置
      operationId: admin.settings.notifications.update
      summary: 保存三个平台的共享机器人设置
      description: 需要 admin.page.settings.view 和 admin.page.settings.update，保留同源检查。 空字符串或省略秘密字段保持已有值；clear_secrets 显式清除。 加密持久化并用 revision 防止并发覆盖，不发消息、不请求机器人。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
      responses:
        "200":
          $ref: "#/components/responses/NotificationSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 修订冲突，请重新加载。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    AdminCookie:
      type: apiKey
      in: cookie
      name: hlyq_admin_token
      description: 后台登录签发的 HttpOnly JWT Cookie，Cookie 名称可由部署配置调整。
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: 与响应体 request_id 相同的请求标识。
      schema:
        type: string
        minLength: 1
  responses:
    AdminEntrySuccess:
      description: 当前实际生效的后台首级路径。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - admin_path
                    properties:
                      admin_path:
                        type: string
                        pattern: ^[a-z][a-z0-9-]{2,31}$
                        minLength: 3
                        maxLength: 32
    NotificationSuccess:
      description: 共享机器人配置状态，不包含原始凭据。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettings"
    BaseSuccess:
      description: 基础设置
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseResponse"
    SecuritySuccess:
      description: 安全设置
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecurityResponse"
    Unauthorized:
      description: 未登录或登录已失效。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 账号状态或权限不允许操作。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 字段缺失、值或类型错误，或包含额外字段；data.errors 提供字段错误数组。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 42200
            message: 参数校验失败
            data:
              errors:
                session_expire:
                  - 登录有效期必须为范围内的整数
            request_id: example-request-id
    InternalError:
      description: 设置读取或保存失败、安全配置损坏等服务端异常；不暴露 SQL 或堆栈。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - sort_order
      properties:
        id:
          type: integer
          minimum: 1
        code:
          type: string
          enum:
            - base
            - security
            - registration
            - notifications
        name:
          type: string
          maxLength: 64
        sort_order:
          type: integer
          minimum: 0
    BaseSettings:
      type: object
      additionalProperties: false
      required:
        - site_title
        - site_url
        - copyright
        - icp_record
        - public_security_record
        - business_license
      description: 读取旧安装时缺失的基础值可能为空字符串，保存时使用 BaseSettingsInput 规则。
      properties:
        site_title:
          type: string
        site_url:
          type: string
        copyright:
          type: string
        icp_record:
          type: string
        public_security_record:
          type: string
        business_license:
          type: string
    BaseSettingsInput:
      type: object
      additionalProperties: false
      required:
        - site_title
        - site_url
        - copyright
        - icp_record
        - public_security_record
        - business_license
      description: 所有键必传；可选文本传空字符串，禁止 null。字符串先去除首尾空白再校验长度。
      properties:
        site_title:
          type: string
          minLength: 2
          maxLength: 120
        site_url:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 255
        copyright:
          type: string
          maxLength: 200
        icp_record:
          type: string
          maxLength: 100
        public_security_record:
          type: string
          maxLength: 100
        business_license:
          type: string
          maxLength: 100
    RegistrationSettings:
      type: object
      additionalProperties: false
      required:
        - mobile_enabled
        - email_enabled
        - mobile_verification
        - email_verification
      properties:
        mobile_enabled:
          type: integer
          enum:
            - 0
            - 1
        email_enabled:
          type: integer
          enum:
            - 0
            - 1
        mobile_verification:
          type: integer
          enum:
            - 0
            - 1
        email_verification:
          type: integer
          enum:
            - 0
            - 1
    SecuritySettings:
      type: object
      additionalProperties: false
      required:
        - session_expire
        - login_attempts
        - login_window
      description: 必须序列化为 JSON 整数，禁止数字字符串、布尔值以及 10.0 这样的浮点数。
      properties:
        session_expire:
          type: integer
          minimum: 5
          maximum: 1440
          description: 新签发后台 JWT 的有效分钟数。
          example: 120
        login_attempts:
          type: integer
          minimum: 1
          maximum: 100
          description: 固定窗口内每个 IP 允许的登录尝试次数，包含成功、失败和非法输入。
          example: 10
        login_window:
          type: integer
          minimum: 10
          maximum: 3600
          description: Redis 登录频率计数的固定窗口秒数。
          example: 60
    SuccessEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: integer
          enum:
            - 0
        message:
          type: string
          example: ok
        request_id:
          type: string
          minLength: 1
    CategoriesResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Category"
    BaseResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BaseSettings"
    SecurityResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SecuritySettings"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: integer
          minimum: 1
        message:
          type: string
        data:
          type: object
          nullable: true
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        request_id:
          type: string
          minLength: 1
    NotificationSettings:
      type: object
      additionalProperties: false
      required:
        - revision
        - configured_secrets
      properties:
        revision:
          type: integer
          minimum: 0
        configured_secrets:
          type: object
          additionalProperties: false
          required:
            - dingtalk
            - wecom
            - feishu
          properties:
            dingtalk:
              $ref: "#/components/schemas/SignedRobotFlags"
            wecom:
              $ref: "#/components/schemas/RobotFlags"
            feishu:
              $ref: "#/components/schemas/SignedRobotFlags"
    RobotFlags:
      type: object
      additionalProperties: false
      required:
        - webhook_url
      properties:
        webhook_url:
          type: boolean
    SignedRobotFlags:
      type: object
      additionalProperties: false
      required:
        - webhook_url
        - sign_secret
      properties:
        webhook_url:
          type: boolean
        sign_secret:
          type: boolean
    NotificationInput:
      type: object
      additionalProperties: false
      required:
        - revision
        - robots
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 2147483646
        robots:
          type: object
          additionalProperties: false
          required:
            - dingtalk
            - wecom
            - feishu
          properties:
            dingtalk:
              $ref: "#/components/schemas/SignedRobotInput"
            wecom:
              $ref: "#/components/schemas/RobotInput"
            feishu:
              $ref: "#/components/schemas/SignedRobotInput"
        clear_secrets:
          type: object
          additionalProperties: false
          properties:
            dingtalk:
              type: array
              items:
                type: string
                enum:
                  - webhook_url
                  - sign_secret
            wecom:
              type: array
              items:
                type: string
                enum:
                  - webhook_url
            feishu:
              type: array
              items:
                type: string
                enum:
                  - webhook_url
                  - sign_secret
    RobotInput:
      type: object
      additionalProperties: false
      properties:
        webhook_url:
          type: string
          maxLength: 512
          writeOnly: true
          description: 固定平台官方 HTTPS 机器人地址；空字符串或省略保留原值。
    SignedRobotInput:
      type: object
      additionalProperties: false
      properties:
        webhook_url:
          type: string
          maxLength: 512
          writeOnly: true
        sign_secret:
          type: string
          maxLength: 256
          writeOnly: true
          description: 空字符串或省略保留原值，清除使用 clear_secrets。
