openapi: 3.1.0
info:
  title: 基础管理与供应配置 API
  version: 1.0.0
  description: 请求字段按当前控制器和 Validator 白名单核对；复杂供应响应暂标记 partial，不将通用信封当成完整业务 Schema。
security:
  - adminCookie: []
  - adminBearer: []
paths:
  /api/admin/v1/auth/login:
    post:
      summary: 管理员账号密码登录
      description: 账号密码通过后，未开启MFA时签发完整Cookie；开启时仅返回mfa_required=true并设置路径受限的HttpOnly临时挑战Cookie，清除旧访问Cookie，不授予访问权限。第二步须调用/auth/mfa/verify。需要同源Origin；两步均受IP频率限制。
      security: []
      responses:
        "200":
          description: 成功；X-Request-Id 与响应 request_id 一致。
          headers:
            X-Request-Id:
              schema:
                type: string
              description: 请求追踪标识
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: integer
                    const: 0
                  message:
                    type: string
                  data:
                    oneOf:
                      - type: object
                        required:
                          - user
                          - permissions
                          - expires_at
                          - mfa_required
                        properties:
                          user:
                            $ref: "#/components/schemas/AdminProfile"
                          permissions:
                            type: array
                            items:
                              type: string
                          expires_at:
                            type: integer
                            description: 登录凭据过期时间，Unix 秒
                          mfa_required:
                            type: boolean
                            const: false
                      - type: object
                        required:
                          - mfa_required
                          - expires_at
                        additionalProperties: false
                        properties:
                          mfa_required:
                            type: boolean
                            const: true
                          expires_at:
                            type: integer
                            description: 第二步验证截止时间，Unix秒；最多5分钟
                  request_id:
                    type: string
        "401":
          description: 未认证或会话失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 权限、同源或归属校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 版本冲突或业务状态不允许
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 字段或业务校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 超过请求频率
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 服务暂时不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  maxLength: 32
                password:
                  type: string
                  maxLength: 128
                  writeOnly: true
                remember:
                  type: boolean
                  default: false
