components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: hlyq_admin_token
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: integer
          minimum: 1
        message:
          type: string
        data:
          description: 字段校验错误通过 data.errors 返回；其他错误可能为 null。
        request_id:
          type: string
    AdministratorInput:
      type: object
      required:
        - username
        - nickname
        - status
        - role_ids
      properties:
        username:
          type: string
          maxLength: 32
          minLength: 6
          pattern: ^[A-Za-z][A-Za-z0-9_]{5,31}$
        nickname:
          type: string
          maxLength: 32
          minLength: 2
        employee_no:
          type:
            - string
            - "null"
          maxLength: 32
        mobile:
          type:
            - string
