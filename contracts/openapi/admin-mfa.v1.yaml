                }
              }
            }
          },
          "409": {
            "description": "绑定状态冲突或已过期",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "字段验证失败，data.errors供表单定位，不重复弹出提示",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "验证次数或安全操作超限",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "服务内部错误",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "安全服务不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "必须与平台受信源匹配"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "current_password",
                  "code",
                  "setup_id"
                ],
                "additionalProperties": false,
                "properties": {
                  "current_password": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128,
                    "writeOnly": true
                  },
                  "code": {
                    "type": "string",
                    "minLength": 6,
                    "maxLength": 35,
                    "writeOnly": true,
                    "description": "recovery=false为6位TOTP；true为32位十六进制恢复码，可含每8位间的连字符"
                  },
                  "recovery": {
                    "type": "boolean",
                    "const": false
                  },
                  "setup_id": {
                    "type": "string",
                    "pattern": "^[a-f0-9]{64}$"
                  }
                }
              }
            }
          }
        }
      }
    },
