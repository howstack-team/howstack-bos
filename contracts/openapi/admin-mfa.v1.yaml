                          "type": "integer",
                          "minimum": 0,
                          "maximum": 10
                        },
                        "recovery_codes": {
                          "type": "array",
                          "maxItems": 10,
                          "items": {
                            "type": "string",
                            "pattern": "^[a-f0-9]{8}(-[a-f0-9]{8}){3}$"
                          },
                          "description": "128位随机一次性恢复码，仅生成时返回；关闭MFA返回空数组"
                        }
                      }
                    },
                    "request_id": {
                      "type": "string"
