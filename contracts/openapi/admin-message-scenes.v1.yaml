{
  "openapi": "3.1.0",
  "info": {
    "title": "消息场景与接收组配置",
    "version": "v1",
    "description": "固定业务场景→多个接收组→渠道与模板。用途及各组支持渠道/变量由服务器目录约束，不支持自由新增场景或发送代理。 注册验证码支持短信与邮件；登录验证码仍仅支持短信，不接受其邮件单条或批量配置。"
  },
  "security": [
    {
      "adminCookie": []
    }
  ],
  "paths": {
    "/api/admin/v1/message-scenes": {
      "get": {
        "operationId": "admin.message-scenes.index",
        "description": "固定场景目录；view权限；不写入空配置。",
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100000,
              "default": 1
            }
          },
          {
            "name": "page_size",
            "in": "query",
            "schema": {
              "type": "integer",
              "enum": [
                10,
                20,
                50,
                100
              ],
              "default": 10
            }
          }
        ],
        "responses": {
          "200": {
            "description": "统一成功响应",
            "headers": {
              "X-Request-Id": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "integer",
                      "const": 0
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "$ref": "#/components/schemas/SceneList"
                    },
                    "request_id": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "message",
                    "data",
                    "request_id"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          },
          "403": {
            "description": "无权限"
          },
          "404": {
            "description": "场景不存在"
          },
          "409": {
            "description": "修订冲突或旧入口不可覆盖新结构"
          },
          "422": {
            "description": "接收组、范围、渠道或模板无效"
          }
        },
        "summary": "读取消息场景列表"
      }
    },
    "/api/admin/v1/message-scenes/{code}": {
      "get": {
        "operationId": "admin.message-scenes.show",
        "description": "只返回脱敏模板和对象选项；按需兼容旧受众配置。",
        "parameters": [
          {
            "name": "code",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9_]{0,63}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "统一成功响应",
            "headers": {
              "X-Request-Id": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "integer",
                      "const": 0
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "$ref": "#/components/schemas/SceneDetail"
                    },
                    "request_id": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "message",
                    "data",
                    "request_id"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          },
          "403": {
            "description": "无权限"
          },
          "404": {
            "description": "场景不存在"
          },
          "409": {
            "description": "修订冲突或旧入口不可覆盖新结构"
          },
          "422": {
            "description": "接收组、范围、渠道或模板无效"
          }
        },
        "summary": "读取消息场景与接收组"
      },
      "put": {
        "operationId": "admin.message-scenes.update",
        "description": "view/update权限及同源写检查；双受众修订同一事务；完整组列表；保存不发送。",
        "parameters": [
          {
            "name": "code",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9_]{0,63}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SceneInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "统一成功响应",
            "headers": {
              "X-Request-Id": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "integer",
                      "const": 0
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "$ref": "#/components/schemas/SceneDetail"
                    },
                    "request_id": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "message",
                    "data",
                    "request_id"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          },
          "403": {
            "description": "无权限"
          },
          "404": {
            "description": "场景不存在"
          },
          "409": {
            "description": "修订冲突或旧入口不可覆盖新结构"
          },
          "422": {
            "description": "接收组、范围、渠道或模板无效"
          }
        },
        "summary": "保存场景接收组与渠道"
      }
    },
    "/api/admin/v1/message-scenes/batch": {
      "post": {
        "operationId": "admin.message-scenes.batch",
        "description": "view/update权限及同源写检查；仅修改匹配接收组渠道，所有场景原子提交，保留模板及范围。",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SceneBatchInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "统一成功响应",
            "headers": {
              "X-Request-Id": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "integer",
                      "const": 0
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "$ref": "#/components/schemas/SceneBatchResult"
                    },
                    "request_id": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "message",
                    "data",
                    "request_id"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          },
          "403": {
            "description": "无权限"
          },
          "404": {
            "description": "场景不存在"
          },
          "409": {
            "description": "修订冲突或旧入口不可覆盖新结构"
          },
          "422": {
            "description": "接收组、范围、渠道或模板无效"
          }
        },
        "summary": "批量配置消息场景"
      }
    }
  },
