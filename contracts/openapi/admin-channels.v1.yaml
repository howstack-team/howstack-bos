    "/api/public/v1/storage/local": {
      "get": {
        "tags": [
          "文件存储"
        ],
        "summary": "读取限时 HMAC 授权的本地私有附件",
        "description": "业务先检查对象归属，再生成签名链接。固定入口先验签再返回二进制内容，不执行上传内容。支持单段字节Range（206）；不可满足为416。无效或多段Range、无可匹配校验器的If-Range返回200完整内容。音视频使用inline，其余作为附件。",
        "operationId": "downloadSignedLocalObject",
        "parameters": [
          {
            "name": "namespace",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "key",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "expires",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer"
            }
          },
          {
            "name": "signature",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Range",
            "in": "header",
            "description": "单段字节范围，例如bytes=0-1023、bytes=1024-或bytes=-1024",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Range",
            "in": "header",
            "description": "当前未提供资源校验器，携带此字段时返回完整文件",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "已授权附件",
            "content": {
              "application/octet-stream": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            },
            "headers": {
              "Accept-Ranges": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "bytes"
                  ]
                }
              },
              "Content-Length": {
                "schema": {
                  "type": "integer",
                  "minimum": 0
                }
              }
            }
          },
          "403": {
            "description": "签名无效、过期或对象不存在"
          },
          "422": {
