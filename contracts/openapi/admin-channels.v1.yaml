{
  "openapi": "3.1.0",
  "info": {
    "title": "后台基础服务通道配置",
    "version": "v1",
    "description": "七类通道配置及已发布 v1 运行契约，支持 SMTP、支付宝、阿里云、腾讯云、赛邮、短信宝、OSS/COS/七牛/本地存储、微信 Native、微信网站登录和 QQ 登录。邮件提供宿主测试发送，其他完整业务流程由核心接入；启用不代表外部连通、支付成功、认证或会员登录完成。 人机验证通道支持 image_captcha、geetest_v4、yidun_captcha、tencent_captcha、aliyun_captcha。验证只由核心业务用例执行，不开放任意公网验证或放行接口。"
  },
  "security": [
    {
      "adminCookie": []
    }
  ],
